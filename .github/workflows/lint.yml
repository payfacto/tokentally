name: Lint

# doc-lint (the doc-first contract check) runs in bitbucket-pipelines.yml,
# not here: it checks .context/ content, and .context/ is deliberately
# stripped from this GitHub mirror before every push. See scripts/doc-lint.mjs
# and .context/reference/CLAUDE-CONTEXT-PATTERN.md.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  inspector-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend/inspector
        run: npm ci

      - name: Run inspector tests
        working-directory: frontend/inspector
        run: npm test
