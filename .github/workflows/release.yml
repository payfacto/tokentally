name: Build

# Triggered by the Bitbucket -> GitHub mirror (bitbucket-pipelines.yml).
#
# Behavior:
#   - Push to main:     builds all three platforms, uploads artifacts (14d retention).
#   - Push of v* tag:   builds all three platforms AND publishes a GitHub Release
#                       with the archives attached.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write   # required for softprops/action-gh-release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: tokentally-linux-amd64.tar.gz
          - os: windows-latest
            archive: tokentally-windows-amd64.zip
          - os: macos-latest
            archive: tokentally-darwin-arm64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git describe --tags` works

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Wails v2's `wails build` CLI used to do this (and the packaging below)
      # silently. v3 has no such CLI (wails3 build/dev need a Taskfile scaffold
      # this repo doesn't have) - see
      # .context/specs/2026-08-09-wails-v3-build-packaging-design.md.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            build-essential \
            dpkg-dev \
            fuse \
            libfuse2t64 \
            file

      # wails3's standalone `generate` subcommands (syso on Windows, appimage
      # on Linux) need the CLI on PATH. Not needed on macOS - bundle.sh only
      # uses plain go build/sed/cp.
      - name: Install Wails v3 CLI
        if: matrix.os != 'macos-latest'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.5

      # frontend/web/app.bundle.js and app.css are gitignored, //go:embed-ed
      # into the Go binary, and were previously rebuilt transparently by
      # `wails build`. Must run before any of the platform Build steps below.
      - name: Build frontend
        working-directory: frontend/inspector
        run: |
          npm install
          npm run build

      # CFBundleVersion/.syso fixed version/manifest assemblyIdentity all
      # need a numeric X.Y.Z - git describe's "v1.2.3-4-gabcdef-dirty" isn't
      # one. Same derivation as the Makefile's NUMERIC_VERSION.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          v=$(git describe --tags --always --dirty)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          n=$(printf '%s' "$v" | sed -E 's/^v//; s/[-+].*//')
          echo "$n" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || n="0.0.0"
          echo "numeric_version=$n" >> "$GITHUB_OUTPUT"

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NUMERIC_VERSION: ${{ steps.version.outputs.numeric_version }}
        run: build/darwin/bundle.sh "$VERSION" "$NUMERIC_VERSION"

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NUMERIC_VERSION: ${{ steps.version.outputs.numeric_version }}
        run: |
          info=$(mktemp)
          sed -e "s|__VERSION__|$VERSION|g" -e "s|__NUMERIC_VERSION__|$NUMERIC_VERSION|g" build/windows/info.json > "$info"
          manifest=$(mktemp)
          sed -e "s|__NUMERIC_VERSION__|$NUMERIC_VERSION|g" build/windows/wails.exe.manifest > "$manifest"
          wails3 generate syso -icon build/windows/icon.ico -info "$info" -manifest "$manifest" -out wails_windows_amd64.syso -arch amd64
          rm -f "$info" "$manifest"
          GOOS=windows GOARCH=amd64 go build -ldflags "-X 'tokentally/internal/version.Version=$VERSION'" -o build/bin/tokentally.exe .

      # Split from the AppImage step below so a failure there (unproven
      # tooling, FUSE availability in CI) can't take down this working,
      # already-released tar.gz path. AppImage is additive, not a
      # replacement - see the design spec's scope section.
      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: GOOS=linux GOARCH=amd64 go build -ldflags "-X 'tokentally/internal/version.Version=$VERSION'" -o build/bin/tokentally .

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: tar -czvf ${{ matrix.archive }} -C build/bin tokentally

      - name: Build AppImage (Linux)
        id: appimage
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          cp build/appicon.png build/linux/tokentally.png
          wails3 generate appimage -binary build/bin/tokentally -desktopfile build/linux/tokentally.desktop -icon build/linux/tokentally.png -outputdir build/bin
          mv build/bin/*.AppImage tokentally-linux-amd64.AppImage

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path build/bin/tokentally.exe -DestinationPath ${{ matrix.archive }}

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: cd build/bin && zip -r ../../${{ matrix.archive }} TokenTally.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          retention-days: 14

      - name: Upload AppImage artifact
        if: matrix.os == 'ubuntu-latest' && steps.appimage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tokentally-linux-amd64.AppImage
          path: tokentally-linux-amd64.AppImage
          retention-days: 14

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Idempotent: the first matrix job to reach this step creates the
          # release; the others see it already exists and just upload to it.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.archive }}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Attach AppImage to GitHub Release
        if: matrix.os == 'ubuntu-latest' && steps.appimage.outcome == 'success' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "tokentally-linux-amd64.AppImage" --repo "$GITHUB_REPOSITORY" --clobber

  brew-tap:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Compute bare version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download macOS arm64 archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --pattern "tokentally-darwin-arm64.zip" --repo "$GITHUB_REPOSITORY"

      - name: Compute SHA256
        id: sha
        run: echo "arm64=$(sha256sum tokentally-darwin-arm64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: payfacto/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update cask formula
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA256: ${{ steps.sha.outputs.arm64 }}
        run: |
          mkdir -p homebrew-tap/Casks
          cat > homebrew-tap/Casks/tokentally.rb << EOF
          cask "tokentally" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/payfacto/tokentally/releases/download/v#{version}/tokentally-darwin-arm64.zip"
            name "TokenTally"
            desc "Claude Code token usage dashboard"
            homepage "https://github.com/payfacto/tokentally"

            app "TokenTally.app"
          end
          EOF

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/tokentally.rb
          git diff --cached --quiet || git commit -m "chore: bump tokentally to ${{ steps.ver.outputs.version }}"
          git push
